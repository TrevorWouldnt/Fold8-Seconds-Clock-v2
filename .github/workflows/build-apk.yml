name: Build research APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/control-lab-v16']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/fold8-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          .github/scripts/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Check v15 feature preservation and reviewed source hashes
        run: |
          python3 tests/check_source.py
          python3 tests/check_additions.py
          python3 tests/test_sign_helper.py
      - name: Test, lint, and build debug APK
        id: validation
        shell: bash
        run: ./gradlew --no-daemon --max-workers=4 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease 2>&1 | tee build-validation.log
      - name: Report validation results
        if: always() && steps.validation.outcome != 'skipped'
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: python3 tools/report_checks.py
      - name: Verify module packaging and APK signature
        run: |
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fold8-Control-Lab-v16.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Fold8-Control-Lab-v16-unsigned.apk
          bash tools/package-sign-helper.sh dist/Fold8-Control-Lab-v16.apk \
            "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/sign-v16-with-phone-key.sh
          python3 tests/test_sign_helper_real.py dist/Fold8-Control-Lab-v16.apk \
            "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$JAVA_HOME"
          cd dist
          sha256sum Fold8-Control-Lab-v16.apk Fold8-Control-Lab-v16-unsigned.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Fold8-Control-Lab-v16-UNTESTED
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Fold8-Control-Lab-v16.apk
            dist/Fold8-Control-Lab-v16-unsigned.apk
            dist/SHA256SUMS
            dist/sign-v16-with-phone-key.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            build-validation.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
