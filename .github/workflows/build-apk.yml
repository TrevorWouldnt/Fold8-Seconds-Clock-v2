name: Build research APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/fold8-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          .github/scripts/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build debug APK
        id: validation
        shell: bash
        run: ./gradlew --no-daemon --max-workers=4 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build-validation.log
      - name: Report validation results
        if: always() && steps.validation.outcome != 'skipped'
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: python3 tools/report_checks.py
      - name: Verify module packaging and APK signature
        run: |
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Fold8-Seconds-Clock-UNTESTED
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            build-validation.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
