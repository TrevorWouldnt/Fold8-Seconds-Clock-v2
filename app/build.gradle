plugins { id 'com.android.application' }

configurations { robolectricSdk }

def prepareRobolectricSdk = tasks.register('prepareRobolectricSdk', Copy) {
    from configurations.robolectricSdk
    into layout.buildDirectory.dir('robolectric-sdk')
}

android {
    namespace 'com.fold8.secondsclock'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fold8.secondsclock'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3-clocks-and-gestures'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            dependsOn prepareRobolectricSdk
            // Resolve once through Gradle (with its cache/retries), rather than
            // starting parallel Maven downloads inside each test sandbox.
            systemProperty 'robolectric.offline', 'true'
            systemProperty 'robolectric.dependency.dir', layout.buildDirectory.dir('robolectric-sdk').get().asFile.absolutePath
        }
    }
}

dependencies {
    // Signatures only; Vector supplies the Xposed API at runtime.
    // This library is not bundled inside the resulting APK.
    compileOnly project(':xposed-api-stubs')
    testImplementation project(':xposed-api-stubs')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    robolectricSdk 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
}
